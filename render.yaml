# Render(https://render.com)에 올릴 때 쓰는 설정입니다. Vercel 대신 쓸 수 있습니다.
# Render 대시보드 → New → Blueprint → 이 저장소 선택 → KOREAEXIM_API_KEY 값만 입력하면 됩니다.
services:
  - type: web
    name: aurelis-trade-console
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/fx
    envVars:
      - key: KOREAEXIM_API_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
